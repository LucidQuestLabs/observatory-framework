name: Validate Observatory Corpus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py

      - name: Validate approved observations
        run: python scripts/validate_observations.py

